backend:
  name: git-gateway
  branch: master
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "[skip ci] Upload “{{path}}”"
    deleteMedia: "[skip ci] Delete “{{path}}”"

media_folder: static/img
public_folder: /img

collections:
  - name: "pages"
    label: "Strony"
    files:
      - file: "src/pages/index.md"
        label: "Strona główna"
        name: "index"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "index-page",
            }
          - { label: "Tytuł", name: "title", widget: "string" }
          - { label: "Zdjęcie główne (hero)", name: "image", widget: "image" }
          - { label: "Nagłówek", name: "heading", widget: "string" }
          - {
              label: "Podtytuł (pod nagłówkiem)",
              name: "subheading",
              widget: "string",
            }
          - {
              label: "Trzy punkty na stronie głównej",
              name: "points",
              widget: "object",
              fields:
                [
                  { label: "Punkt 1", name: "one", widget: "string" },
                  { label: "Punkt 2", name: "two", widget: "string" },
                  { label: "Punkt 3", name: "three", widget: "string" },
                ],
            }
          - {
              label: "Sekcja «O stajni»",
              name: "mainpitch",
              widget: "object",
              fields:
                [
                  { label: "Tytuł", name: "title", widget: "string" },
                  {
                    label: "Opis 1",
                    name: "description",
                    widget: "text",
                  },
                  {
                    label: "Opis 2 (zapisy, opiekunowie)",
                    name: "description2",
                    widget: "text",
                  },
                  {
                    label: "Zdjęcie 1",
                    name: "image",
                    widget: "object",
                    fields:
                      [
                        {
                          label: "Zdjęcie",
                          name: "image",
                          widget: "image",
                        },
                        { label: "Alt", name: "alt", widget: "string" },
                      ],
                  },
                  {
                    label: "Zdjęcie 2",
                    name: "image2",
                    widget: "object",
                    fields:
                      [
                        {
                          label: "Zdjęcie",
                          name: "image",
                          widget: "image",
                        },
                        { label: "Alt", name: "alt", widget: "string" },
                      ],
                  },
                ],
            }
          - {
              label: "Sekcja «Czego potrzebujesz aby zacząć?»",
              name: "main",
              widget: "object",
              fields:
                [
                  { label: "Nagłówek", name: "heading", widget: "string" },
                  {
                    label: "Opis",
                    name: "description",
                    widget: "text",
                  },
                  {
                    label: "Zdjęcie",
                    name: "image",
                    widget: "object",
                    fields:
                      [
                        {
                          label: "Zdjęcie",
                          name: "image",
                          widget: "image",
                        },
                        { label: "Alt", name: "alt", widget: "string" },
                      ],
                  },
                ],
            }
          - {
              label: "Sekcja «Jak zacząć?» (dla dzieci)",
              name: "main2",
              widget: "object",
              fields:
                [
                  { label: "Nagłówek", name: "heading", widget: "string" },
                  {
                    label: "Opis",
                    name: "description",
                    widget: "text",
                  },
                  {
                    label: "Zdjęcie",
                    name: "image",
                    widget: "object",
                    fields:
                      [
                        {
                          label: "Zdjęcie",
                          name: "image",
                          widget: "image",
                        },
                        { label: "Alt", name: "alt", widget: "string" },
                      ],
                  },
                ],
            }
      - file: "src/pages/about/index.md"
        label: "Cennik"
        name: "about"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "about-page",
            }
          - { label: "Tytuł", name: "title", widget: "string" }
          - { label: "Zdjęcie nagłówka", name: "image", widget: "image" }
          - {
              label: "Data obowiązywania",
              name: "validFrom",
              widget: "string",
            }
          - {
              label: "Grupy cenowe (karty)",
              name: "groups",
              widget: "list",
              summary: "{{fields.name}}",
              fields:
                [
                  { label: "Nazwa", name: "name", widget: "string" },
                  {
                    label: "Notka pod nagłówkiem",
                    name: "note",
                    widget: "string",
                    required: false,
                  },
                  {
                    label: "Karta wyróżniona",
                    name: "featured",
                    widget: "boolean",
                    default: false,
                    required: false,
                  },
                  {
                    label: "Pozycje cenowe",
                    name: "items",
                    widget: "list",
                    summary: "{{fields.name}} {{fields.price}}",
                    fields:
                      [
                        {
                          label: "Usługa",
                          name: "name",
                          widget: "string",
                        },
                        {
                          label: "Szczegóły (np. czas)",
                          name: "detail",
                          widget: "string",
                          required: false,
                        },
                        {
                          label: "Cena",
                          name: "price",
                          widget: "string",
                        },
                      ],
                  },
                  {
                    label: "Notka na dole karty",
                    name: "note2",
                    widget: "text",
                    required: false,
                  },
                ],
            }
          - {
              label: "Informacje dodatkowe",
              name: "info",
              widget: "list",
              summary: "{{fields.heading}}",
              fields:
                [
                  { label: "Nagłówek", name: "heading", widget: "string" },
                  { label: "Treść", name: "text", widget: "text" },
                ],
            }
      - file: "src/pages/konie-jackowo/index.md"
        label: "Nasze konie"
        name: "konie-jackowo"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "konie-jackowo",
            }
          - { label: "Tytuł", name: "title", widget: "string" }
          - { label: "Zdjęcie nagłówka", name: "image", widget: "image" }
          - { label: "Nagłówek", name: "heading", widget: "string" }
          - {
              label: "Konie",
              name: "intro",
              widget: "object",
              fields:
                [
                  {
                    label: "Lista koni",
                    name: "blurbs",
                    widget: "list",
                    fields:
                      [
                        { label: "Zdjęcie", name: "image", widget: "image" },
                        {
                          label: "Dane (imię, rasa, data ur.)",
                          name: "text",
                          widget: "text",
                        },
                        { label: "Link do rodowodu", name: "url", widget: "string" },
                        { label: "Opis", name: "opis", widget: "text" },
                      ],
                  },
                ],
            }
